<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141413" />
      <stop offset="100%" stopColor="#0C0A09" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Solar Horizon Arc -->
  <path
    d="M 96 328 A 160 160 0 0 1 416 328"
    fill="none"
    stroke="url(#sun)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <!-- Horizon Line -->
  <line
    x1="76"
    y1="328"
    x2="436"
    y2="328"
    stroke="#FBBF24"
    stroke-width="10"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />
  <!-- Zenith Sun Disc -->
  <circle cx="256" cy="168" r="36" fill="#FDE047" />
  <!-- Hebrew Letter Aleph / Orah Symbol -->
  <text
    x="256"
    y="428"
    text-anchor="middle"
    fill="#FEF3C7"
    font-family="serif"
    font-size="78"
    font-weight="bold"
  >
    אורה
  </text>
</svg>
